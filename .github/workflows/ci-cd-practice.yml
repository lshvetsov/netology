name: CI/CD practice

on:
  push:
    branches:
      - '**'

permissions:
  contents: read

defaults:
  run:
    working-directory: software-development/HW1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build zipapp
        run: |
          mkdir -p dist
          python -m zipapp src/ci_demo -o dist/ci-demo.pyz
      - uses: actions/upload-artifact@v4
        with:
          name: ci-demo
          path: software-development/HW1/dist/ci-demo.pyz
          if-no-files-found: error

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install checkers
        run: python -m pip install -r requirements-ci.txt
      - name: Lint
        run: ruff check src tests
      - name: Security scan
        if: success() || failure()
        run: bandit -r src

  notify:
    runs-on: ubuntu-latest
    needs: [build, quality]
    if: always()
    steps:
      - name: Send status to Slack
        working-directory: .
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD_RESULT: ${{ needs.build.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is missing, skipping notification"
            exit 0
          fi

          status="failure"
          if [ "$BUILD_RESULT" = success ] && [ "$QUALITY_RESULT" = success ]; then
            status="success"
          fi

          text="CI/CD: $status (build: $BUILD_RESULT, quality: $QUALITY_RESULT). $RUN_URL"
          payload=$(jq -n --arg text "$text" '{text: $text}')
          curl --fail --silent --show-error --max-time 15 \
            -H 'Content-Type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
